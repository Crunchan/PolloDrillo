<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐔 PolloDrillo — przeniesiono</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 30%, #1a2848 0%, #0a1220 60%, #050a14 100%);
    color:#fff; font-family:'Baloo 2',system-ui,sans-serif; text-align:center;
    padding:20px;
  }
  .box { max-width:520px; }
  .logo { font-size:72px; margin-bottom:16px; animation:float 2.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-10px) rotate(3deg)} }
  h1 { font-size:26px; font-weight:800; color:#ffe27a; margin-bottom:10px; text-shadow:0 0 24px rgba(255,200,100,.5); }
  p  { font-size:14px; line-height:1.6; opacity:.85; margin-bottom:24px; }
  .spinner {
    width:38px; height:38px; margin:0 auto 20px;
    border:4px solid rgba(255,255,255,.15);
    border-top-color:#ffe27a; border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg) } }
  .status { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; opacity:.55; margin-top:16px; min-height:18px; }
  a.btn {
    display:inline-block; margin-top:20px;
    background:linear-gradient(160deg,#ffd86a,#cc8000);
    color:#4a2800; font-weight:800; padding:13px 26px;
    border-radius:16px; text-decoration:none; font-size:15px;
    box-shadow:0 10px 30px rgba(255,180,60,.4);
  }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🐔</div>
  <h1>Przenoszenie Twojego konta…</h1>
  <p>Zaraz przeniesiemy Cię na nowy adres gry.<br>Twoje konta, złoto, motywy i skiny zostaną zachowane.</p>
  <div class="spinner"></div>
  <div class="status" id="status">Sprawdzanie zapisu…</div>
  <a class="btn" id="manual" href="https://pollodrillo.pages.dev/" style="display:none;">Przejdź do gry →</a>
</div>

<script>
(function () {
  const WORKER = 'https://pollo-api.crunchdevelop.workers.dev';
  const NEW_SITE = 'https://pollodrillo.pages.dev/';
  const statusEl = document.getElementById('status');
  const manualEl = document.getElementById('manual');

  function setStatus(t) { statusEl.textContent = t; }

  function redirect(url) {
    setStatus('Przekierowanie…');
    location.replace(url);
  }

  function fallback(msg) {
    setStatus(msg || 'Nie udało się przenieść konta');
    manualEl.style.display = 'inline-block';
    // i tak po 2s przekieruj
    setTimeout(() => redirect(NEW_SITE), 2000);
  }

  async function run() {
    const out = { accounts: null, saves: {}, legacySave: null, legacyPid: null };
    try {
      out.accounts = localStorage.getItem('pollo_accounts_v1');
      if (out.accounts) {
        const accs = JSON.parse(out.accounts) || [];
        for (const a of accs) {
          if (!a || !a.id) continue;
          const raw = localStorage.getItem('pollo_cocodrillo_v3_' + a.id);
          if (raw) out.saves[a.id] = raw;
        }
      }
      out.legacySave = localStorage.getItem('pollo_cocodrillo_v3');
      out.legacyPid  = localStorage.getItem('pollo_pid');
    } catch (e) {}

    const hasAny = out.accounts || out.legacySave;
    if (!hasAny) {
      setStatus('Brak danych do przeniesienia');
      setTimeout(() => redirect(NEW_SITE), 800);
      return;
    }

    setStatus('Wysyłanie danych na serwer…');
    try {
      const r = await fetch(WORKER + '/api/migrate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(out)
      });
      if (r.ok) {
        const { code } = await r.json();
        setStatus('Gotowe! Przekierowanie…');
        redirect(NEW_SITE + '?migrate=' + code);
        return;
      }
      fallback('Błąd serwera — spróbuj ponownie później');
    } catch (e) {
      fallback('Brak połączenia — spróbuj ponownie');
    }
  }

  run();
})();
</script>
</body>
</html>
