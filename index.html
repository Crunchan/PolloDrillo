<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=https://pollodrillo.pages.dev/">
<title>Pollo & Cocodrillo — przekierowanie...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a1428;
    color: #fff;
    font-family: 'Baloo 2', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .box {
    animation: fade 0.4s ease;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .logo {
    font-size: 84px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 40px rgba(255,210,100,0.6));
    animation: bob 1.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffe27a;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-shadow: 0 0 24px rgba(255,200,60,0.6);
  }
  p {
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 1px;
    font-weight: 700;
  }
  a {
    color: #9fe8ff;
    text-decoration: none;
    font-weight: 800;
  }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🐔</div>
  <h1>Przekierowanie...</h1>
  <p>Jeśli nie nastąpi automatycznie:<br><a href="https://pollodrillo.pages.dev/">pollodrillo.pages.dev</a></p>
</div>

<script>
  // Natychmiastowe przekierowanie (backup jeśli meta refresh zawiedzie)
  window.location.replace('https://pollodrillo.pages.dev/');
</script>
</body>
</html>
