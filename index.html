<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="refresh" content="0;url=https://pollodrillo.pages.dev/">
<title>🐔 PolloDrillo — przekierowanie</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 30%, #1a2848 0%, #0a1220 60%, #050a14 100%);
    color:#fff; font-family:'Baloo 2',system-ui,sans-serif; text-align:center;
    padding:20px;
  }
  .box { max-width:520px; }
  .logo { font-size:72px; margin-bottom:16px; animation:float 2.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-10px) rotate(3deg)} }
  h1 { font-size:26px; font-weight:800; color:#ffe27a; margin-bottom:10px; text-shadow:0 0 24px rgba(255,200,100,.5); }
  p  { font-size:14px; line-height:1.6; opacity:.85; margin-bottom:24px; }
  .spinner {
    width:38px; height:38px; margin:0 auto 20px;
    border:4px solid rgba(255,255,255,.15);
    border-top-color:#ffe27a; border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg) } }
  a.btn {
    display:inline-block; margin-top:10px;
    background:linear-gradient(160deg,#ffd86a,#cc8000);
    color:#4a2800; font-weight:800; padding:13px 26px;
    border-radius:16px; text-decoration:none; font-size:15px;
    box-shadow:0 10px 30px rgba(255,180,60,.4);
  }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🐔</div>
  <h1>Przekierowywanie do gry…</h1>
  <p>Strona została przeniesiona pod nowy adres.<br>Za chwilę nastąpi automatyczne przekierowanie.</p>
  <div class="spinner"></div>
  <a class="btn" href="https://pollodrillo.pages.dev/">Kliknij tutaj, jeśli nie przekierowano →</a>
</div>

<script>
  window.location.replace('https://pollodrillo.pages.dev/');
</script>
</body>
</html>
