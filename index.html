<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐔 Pollo Transform Clicker — Low Poly 3D</title>

<!-- Cute rounded font (degrades gracefully to system fonts if offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #9fd8ff;
  font-family: 'Baloo 2', 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

canvas {
  display: block;
  touch-action: none;
  cursor: grab;
}
canvas:active { cursor: grabbing; }

/* ============================================================
   GLASSMORPHISM UI LAYER
   ============================================================ */
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

/* Shared glass panel look */
.panel {
  position: absolute;
  pointer-events: auto;
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1.5px solid rgba(255, 255, 255, 0.42);
  border-radius: 20px;
  box-shadow:
    0 10px 34px rgba(20, 45, 90, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 -6px 16px rgba(255, 255, 255, 0.08);
  color: #fff;
  text-shadow: 0 2px 6px rgba(15, 35, 65, 0.45);
  padding: 12px 16px;
}

/* ---------- TOP LEFT : CURRENCY ---------- */
#statsPanel {
  top: 18px;
  left: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 158px;
}

.stat {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.4px;
  line-height: 1;
}

.stat .icon {
  font-size: 20px;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
}

#goldValue { color: #ffe27a; }
#eggValue  { color: #fff2c4; }

.stat.pop { animation: statPop 0.35s ease; }
@keyframes statPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.22); }
  100% { transform: scale(1); }
}

/* ---------- TOP RIGHT : FOUNTAIN LEVEL ---------- */
#levelPanel {
  top: 18px;
  right: 18px;
  min-width: 214px;
  text-align: right;
}

.lvlTitle {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.6px;
  opacity: 0.92;
  text-transform: uppercase;
}

.lvlTitle b {
  font-size: 17px;
  color: #ffe27a;
}

.bar {
  width: 100%;
  height: 13px;
  border-radius: 9px;
  background: rgba(10, 30, 60, 0.32);
  overflow: hidden;
  margin-top: 7px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.28);
}

.barFill {
  height: 100%;
  width: 33.333%;
  border-radius: 9px;
  background: linear-gradient(90deg, #fff2a8 0%, #ffcf3d 45%, #ff9d13 100%);
  box-shadow: 0 0 14px rgba(255, 200, 60, 0.95);
  transition: width 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
}

.odds {
  margin-top: 8px;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.45;
  opacity: 0.96;
  text-shadow: 0 2px 5px rgba(15, 35, 65, 0.55);
}

/* ---------- BOTTOM CENTER : BUTTONS ---------- */
#buttons {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  pointer-events: none;
}

.btn {
  pointer-events: auto;
  position: relative;
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  border-radius: 20px;
  padding: 11px 22px 12px;
  min-width: 158px;
  font-family: inherit;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.9px;
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.42);
  box-shadow:
    0 10px 24px rgba(15, 40, 80, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.6),
    inset 0 -8px 18px rgba(0, 0, 0, 0.14);
  transition: transform 0.11s ease, box-shadow 0.14s ease, filter 0.14s ease;
  overflow: hidden;
  backdrop-filter: blur(10px) saturate(160%);
  -webkit-backdrop-filter: blur(10px) saturate(160%);
}

/* glossy sheen */
.btn::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 46%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
  border-radius: 20px 20px 40% 40%;
  pointer-events: none;
}

.btn .bSub {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  opacity: 0.94;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}

.btn:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow:
    0 16px 30px rgba(15, 40, 80, 0.36),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -8px 18px rgba(0, 0, 0, 0.14);
}

.btn:active:not(:disabled) {
  transform: translateY(1px) scale(0.975);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  filter: grayscale(0.65) brightness(0.9);
}

#btnSpawn   { background: linear-gradient(180deg, #86e05c 0%, #46ab44 100%); }
#btnUpgrade { background: linear-gradient(180deg, #ffe07a 0%, #f0a410 100%); color: #5a3500; text-shadow: 0 1px 3px rgba(255, 255, 255, 0.4); }
#btnUpgrade .bSub { text-shadow: none; }
#btnAuto    { background: linear-gradient(180deg, #7cc9ff 0%, #2b86d6 100%); }

/* ---------- FLOATING 3D WORLD POPUPS ---------- */
#popups {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  overflow: hidden;
}

.popup {
  position: absolute;
  left: 0;
  top: 0;
  font-family: 'Baloo 2', system-ui, sans-serif;
  font-weight: 800;
  font-size: 27px;
  letter-spacing: 0.5px;
  color: #ffd24a;
  white-space: nowrap;
  will-change: transform, opacity;
  text-shadow:
    0 0 12px rgba(255, 200, 70, 0.95),
    0 0 26px rgba(255, 160, 20, 0.55),
    2px 2px 0 rgba(96, 52, 0, 0.95),
    -2px -2px 0 rgba(96, 52, 0, 0.95),
    2px -2px 0 rgba(96, 52, 0, 0.95),
    -2px 2px 0 rgba(96, 52, 0, 0.95);
}

.popup.egg {
  color: #fff6cf;
  font-size: 22px;
  text-shadow:
    0 0 14px rgba(255, 240, 180, 1),
    0 0 28px rgba(255, 200, 80, 0.8),
    2px 2px 0 rgba(120, 80, 0, 0.95),
    -2px -2px 0 rgba(120, 80, 0, 0.95);
}

/* ---------- TITLE / HELP ---------- */
#hint {
  position: absolute;
  bottom: 24px;
  left: 22px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.6px;
  color: rgba(255, 255, 255, 0.92);
  text-shadow: 0 2px 6px rgba(15, 35, 65, 0.6);
  pointer-events: none;
  opacity: 0.9;
  line-height: 1.5;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 760px) {
  .btn { min-width: 118px; padding: 9px 14px 10px; font-size: 12px; }
  .btn .bSub { font-size: 10px; }
  #statsPanel { transform: scale(0.88); transform-origin: top left; }
  #levelPanel { transform: scale(0.88); transform-origin: top right; }
  #hint { display: none; }
  #buttons { bottom: 14px; gap: 9px; }
  .popup { font-size: 21px; }
}
</style>
</head>
<body>

<!-- ============================================================
     2D HUD OVERLAY (HTML/CSS — glassmorphism)
     ============================================================ -->
<div id="hud">

  <!-- TOP LEFT: currency -->
  <div class="panel" id="statsPanel">
    <div class="stat" id="goldStat"><span class="icon">🪙</span><span id="goldValue">0</span></div>
    <div class="stat" id="eggStat"><span class="icon">🥚</span><span id="eggValue">0</span></div>
  </div>

  <!-- TOP RIGHT: fountain level -->
  <div class="panel" id="levelPanel">
    <div class="lvlTitle">Poziom Fontanny <b id="levelNum">1</b>/3</div>
    <div class="bar"><div class="barFill" id="levelBar"></div></div>
    <div class="odds" id="oddsText">Red Pollo → Green Croc 100%</div>
  </div>

  <!-- BOTTOM CENTER: action buttons -->
  <div id="buttons">
    <button class="btn" id="btnSpawn">
      🐔 SPAWN POLLO
      <span class="bSub">Darmowe</span>
    </button>
    <button class="btn" id="btnUpgrade">
      ⬆️ ULEPSZ FONTANNĘ
      <span class="bSub" id="upgradeCost">30 🪙</span>
    </button>
    <button class="btn" id="btnAuto">
      🤖 AUTO-SPAWNER
      <span class="bSub" id="autoCost">110 🪙</span>
    </button>
  </div>

  <!-- small hint -->
  <div id="hint">
    Przeciągnij myszą — obrót kamery<br>
    Scroll — przybliżenie
  </div>
</div>

<!-- floating "+1g" style popups get injected here -->
<div id="popups"></div>

<!-- ============================================================
     THREE.JS IMPORT MAP (CDN, no build tools)
     ============================================================ -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<!-- ============================================================
     GAME LOGIC
     ============================================================ -->
<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. MATH / RANDOM / GEOMETRY UTILITIES
   ============================================================ */

/** Deterministic pseudo-random generator (so the world always looks the same). */
let _seed = 987654321;
function rand() {
  _seed = (_seed * 1664525 + 1013904223) >>> 0;
  return _seed / 4294967296;
}
function randRange(a, b) { return a + rand() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/** Reusable color scratch object to avoid allocations. */
const _tmpColor = new THREE.Color();

/**
 * Push a single flat-shaded triangle into raw position/color arrays.
 * Adds a tiny per-triangle brightness jitter for that hand-crafted low-poly feel.
 */
function pushTri(pos, col, a, b, c, color, jitter = 0.06) {
  pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  _tmpColor.set(color);
  const f = 1 + (rand() - 0.5) * jitter * 2;
  for (let i = 0; i < 3; i++) {
    col.push(
      Math.min(1, _tmpColor.r * f),
      Math.min(1, _tmpColor.g * f),
      Math.min(1, _tmpColor.b * f)
    );
  }
}

/** Build a BufferGeometry (non-indexed, vertex-colored) from raw arrays. */
function buildGeometry(pos, col) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

/**
 * Convert any primitive geometry into a non-indexed, vertex-colored one.
 * Every triangle gets a slightly randomized shade -> richer low-poly look.
 */
function colorize(geo, color, jitter = 0.07) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const count = g.attributes.position.count;
  const arr = new Float32Array(count * 3);
  const c = new THREE.Color(color);
  for (let i = 0; i < count; i += 3) {
    const f = 1 + (rand() - 0.5) * jitter * 2;
    for (let k = 0; k < 3; k++) {
      arr[(i + k) * 3 + 0] = Math.min(1, c.r * f);
      arr[(i + k) * 3 + 1] = Math.min(1, c.g * f);
      arr[(i + k) * 3 + 2] = Math.min(1, c.b * f);
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}

/**
 * Merge a list of non-indexed, vertex-colored geometries into one.
 * This is the key optimization: an entire chicken becomes ONE draw call.
 */
function mergeGeos(list) {
  let total = 0;
  for (const g of list) total += g.attributes.position.count;

  const pos = new Float32Array(total * 3);
  const col = new Float32Array(total * 3);
  let off = 0;

  for (const g of list) {
    pos.set(g.attributes.position.array, off * 3);
    col.set(g.attributes.color.array, off * 3);
    off += g.attributes.position.count;
  }

  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeVertexNormals();
  return out;
}

/* ============================================================
   2. RENDERER / SCENE / CAMERA / LIGHTS
   ============================================================ */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe4ff, 62, 190);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 600);

/* ---- Orbit-style camera state (custom, no external addon needed) ---- */
const camState = {
  target: new THREE.Vector3(0, 1.6, 0),
  theta: 0,          // horizontal angle
  phi: 0.98,         // vertical angle (0 = top, PI/2 = horizon)
  radius: 27         // distance
};

function updateCamera() {
  const { target, theta, phi, radius } = camState;
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
}
updateCamera();

/* ---- Lights ---- */
const hemi = new THREE.HemisphereLight(0xcfeaff, 0x6b8f4a, 1.05);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4dd, 2.0);
sun.position.set(15, 26, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28;
sun.shadow.camera.bottom = -28;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0012;
sun.shadow.normalBias = 0.025;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, 0);

/* Warm bounce light from the vortex */
const vortexLight = new THREE.PointLight(0xffb733, 2.4, 14, 2);
vortexLight.position.set(0, 2.0, 0);
scene.add(vortexLight);

/* ============================================================
   3. SHARED MATERIALS
   ============================================================ */

const MAT = {
  /** Standard low-poly body material: vertex colors + flat shading. */
  body: new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }),
  /** Golden variant: same but glowing. */
  gold: new THREE.MeshLambertMaterial({
    vertexColors: true, flatShading: true,
    emissive: 0x7a5200, emissiveIntensity: 1.0
  }),
  /** Sky dome. */
  sky: null // assigned later
};

/* ============================================================
   4. WORLD CONSTRUCTION — SKY, ISLANDS, BARN, BRIDGES, FOUNTAIN
   ============================================================ */

/* ------------------------------------------------------------
   4.1 SKY DOME (gradient vertex-colored backside sphere)
   ------------------------------------------------------------ */
function createSkyDome() {
  const geo = new THREE.SphereGeometry(230, 22, 14);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);

  const top = new THREE.Color(0x3f9fe0);
  const bottom = new THREE.Color(0xe4f4ff);
  const c = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    const t = clamp(pos.getY(i) / 230 * 0.5 + 0.5, 0, 1);
    c.copy(bottom).lerp(top, Math.pow(t, 0.85));
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.MeshBasicMaterial({
    vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false
  });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = -1000;
  return m;
}
scene.add(createSkyDome());

/* ------------------------------------------------------------
   4.2 FLOATING ISLAND
   A hand-built low-poly island: flat grassy top, tapering rocky underside.
   Vertex counts are deliberately tiny (10 segments x 5 rings).
   ------------------------------------------------------------ */
function createIslandGeometry(radius, depth, segments = 10) {

  // Ring profile: [radiusFactor, yFactor, bandColor]
  const RINGS = [
    { r: 1.00, y:  0.00, c: 0x7ec850 },  // top rim (grass)
    { r: 0.99, y: -0.10, c: 0x63b03e },  // grass edge
    { r: 0.90, y: -0.32, c: 0x8a6642 },  // dirt
    { r: 0.68, y: -0.62, c: 0x775433 },  // darker dirt
    { r: 0.34, y: -0.86, c: 0x5f4029 }   // deep rock
  ];

  const pos = [];
  const col = [];

  // --- generate jittered ring points ---
  const rings = [];
  for (let ri = 0; ri < RINGS.length; ri++) {
    const def = RINGS[ri];
    const pts = [];
    for (let s = 0; s < segments; s++) {
      const a = (s / segments) * Math.PI * 2 + ri * 0.22; // twist each ring a bit
      const j = 1 + (rand() - 0.5) * 0.22;                // radial jitter
      const rr = def.r * radius * j;
      const yy = def.y * depth * (1 + (rand() - 0.5) * 0.18);
      pts.push(new THREE.Vector3(Math.cos(a) * rr, yy, Math.sin(a) * rr));
    }
    rings.push(pts);
  }

  // --- flat grassy top cap (fan) ---
  const center = new THREE.Vector3(0, 0, 0);
  for (let s = 0; s < segments; s++) {
    const a = rings[0][s];
    const b = rings[0][(s + 1) % segments];
    // winding (center, b, a) → normal points UP
    pushTri(pos, col, center, b, a, 0x8ed158, 0.09);
  }

  // --- side bands ---
  for (let ri = 0; ri < RINGS.length - 1; ri++) {
    for (let s = 0; s < segments; s++) {
      const s2 = (s + 1) % segments;
      const a = rings[ri][s];
      const b = rings[ri][s2];
      const c = rings[ri + 1][s2];
      const d = rings[ri + 1][s];
      const color = RINGS[ri + 1].c;
      pushTri(pos, col, a, b, c, color, 0.11);
      pushTri(pos, col, a, c, d, color, 0.11);
    }
  }

  // --- bottom tip (rocky point) ---
  const tip = new THREE.Vector3(0, -1.18 * depth, 0);
  const last = rings[RINGS.length - 1];
  for (let s = 0; s < segments; s++) {
    const a = last[s];
    const b = last[(s + 1) % segments];
    pushTri(pos, col, a, b, tip, 0x51392a, 0.11); // placeholder replaced below
  }

  return buildGeometry(pos, col);
}

/* Small fix — the line above intentionally keeps the API tidy; we rebuild the
   bottom tip properly here to avoid any typo colour leaking into the palette. */
function createIslandGeometryFixed(radius, depth, segments = 10) {
  const geo = createIslandGeometry(radius, depth, segments);
  // Recolor the very bottom vertices (below a threshold) to a dark rock tone.
  const p = geo.attributes.position;
  const c = geo.attributes.color;
  const rock = new THREE.Color(0x51392a);
  for (let i = 0; i < p.count; i++) {
    if (p.getY(i) < -0.62 * depth) {
      const f = 1 + (rand() - 0.5) * 0.14;
      c.setXYZ(i, rock.r * f, rock.g * f, rock.b * f);
    }
  }
  c.needsUpdate = true;
  return geo;
}

/** Create an island mesh + tiny decorative rocks/grass tufts on top. */
function createIsland(x, z, radius, depth, seedOffset = 0) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  const geo = createIslandGeometryFixed(radius, depth);
  const island = new THREE.Mesh(geo, MAT.body);
  island.receiveShadow = true;
  island.castShadow = true;
  group.add(island);

  // --- decorative grass tufts / small rocks on the plateau ---
  const decorParts = [];
  const tuftCount = 9;
  for (let i = 0; i < tuftCount; i++) {
    const a = rand() * Math.PI * 2;
    const r = rand() * radius * 0.78;
    const px = Math.cos(a) * r;
    const pz = Math.sin(a) * r;
    // small pyramid "bush"
    const h = randRange(0.22, 0.42);
    const bush = new THREE.ConeGeometry(randRange(0.12, 0.2), h, 5);
    bush.rotateY(rand() * 6.28);
    bush.translate(px, h * 0.5, pz);
    decorParts.push(colorize(bush, rand() > 0.5 ? 0x5fa83a : 0x74c24a, 0.14));
  }
  // a couple of little grey rocks
  for (let i = 0; i < 4; i++) {
    const a = rand() * Math.PI * 2;
    const r = rand() * radius * 0.8;
    const rock = new THREE.IcosahedronGeometry(randRange(0.14, 0.26), 0);
    rock.scale(1, 0.7, 1);
    rock.translate(Math.cos(a) * r, 0.1, Math.sin(a) * r);
    decorParts.push(colorize(rock, 0x9aa0a6, 0.12));
  }
  const decor = new THREE.Mesh(mergeGeos(decorParts), MAT.body);
  decor.castShadow = true;
  decor.receiveShadow = true;
  group.add(decor);

  scene.add(group);
  return group;
}

/* ------------------------------------------------------------
   4.3 LOW-POLY BARN  (image_0 style: red box + pitched roof)
   ------------------------------------------------------------ */
/** Triangular prism helper (used for the roof). */
function createPrismGeometry(w, h, d, color) {
  const pos = [], col = [];
  const x = w / 2, z = d / 2;

  const A = new THREE.Vector3(-x, 0,  z); // front-left
  const B = new THREE.Vector3( x, 0,  z); // front-right
  const C = new THREE.Vector3( 0, h,  z); // front-apex
  const D = new THREE.Vector3(-x, 0, -z); // back-left
  const E = new THREE.Vector3( x, 0, -z); // back-right
  const F = new THREE.Vector3( 0, h, -z); // back-apex

  pushTri(pos, col, A, B, C, color, 0.06); // front gable
  pushTri(pos, col, E, D, F, color, 0.06); // back gable
  pushTri(pos, col, D, A, C, color, 0.06); // left slope
  pushTri(pos, col, D, C, F, color, 0.06);
  pushTri(pos, col, B, E, F, color, 0.06); // right slope
  pushTri(pos, col, B, F, C, color, 0.06);
  pushTri(pos, col, A, D, E, color, 0.06); // underside
  pushTri(pos, col, A, E, B, color, 0.06);

  return buildGeometry(pos, col);
}

/* ------------------------------------------------------------
   4.4 LOW-POLY WOODEN BRIDGE
   Planks + rope railings, merged into a single mesh.
   ------------------------------------------------------------ */
function createBridge(ax, az, bx, bz, width) {
  const dx = bx - ax, dz = bz - az;
  const len = Math.hypot(dx, dz);
  const angle = Math.atan2(-dz, dx); // rotate +X axis onto the bridge direction

  const group = new THREE.Group();
  group.position.set((ax + bx) / 2, 0, (az + bz) / 2);
  group.rotation.y = angle;

  const parts = [];

  // --- deck planks ---
  const plankCount = Math.max(3, Math.round(len / 0.44));
  for (let i = 0; i <= plankCount; i++) {
    const px = -len / 2 + (i / plankCount) * len;
    const shade = (i % 2 === 0) ? 0xa9743f : 0x96663a;
    parts.push(colorize(new THREE.BoxGeometry(0.31, 0.11, width).translate(px, -0.055, 0), shade, 0.13));
  }

  // --- two long support beams underneath ---
  for (const side of [-1, 1]) {
    parts.push(colorize(
      new THREE.BoxGeometry(len, 0.14, 0.16).translate(0, -0.17, side * (width / 2 - 0.1)),
      0x6d4a29, 0.08
    ));
  }

  // --- rope railings (thin 4-sided cylinders) ---
  for (const side of [-1, 1]) {
    const rope = new THREE.CylinderGeometry(0.035, 0.035, len, 4);
    rope.rotateZ(Math.PI / 2);
    rope.translate(0, 0.63, side * (width / 2));
    parts.push(colorize(rope, 0x8a6b45, 0.08));
  }

  // --- railing posts ---
  const postCount = Math.max(2, Math.round(len / 0.85));
  for (let i = 0; i <= postCount; i++) {
    const px = -len / 2 + (i / postCount) * len;
    for (const side of [-1, 1]) {
      parts.push(colorize(
        new THREE.BoxGeometry(0.1, 0.72, 0.1).translate(px, 0.32, side * (width / 2)),
        0x7a5433, 0.09
      ));
    }
  }

  const mesh = new THREE.Mesh(mergeGeos(parts), MAT.body);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  scene.add(group);
  return group;
}

/* ------------------------------------------------------------
   4.5 THE TRANSFORMATION FOUNTAIN  (stone base + golden vortex)
   ------------------------------------------------------------ */
/** Build the swirling funnel-shaped vortex mesh. */
function createVortexGeometry() {
  const pos = [], col = [];
  const RINGS = 15, SEG = 13;
  const topY = 1.15, botY = -0.55;
  const topR = 1.35, botR = 0.1;

  const rings = [];
  for (let r = 0; r <= RINGS; r++) {
    const t = r / RINGS;
    const rad = botR + (topR - botR) * Math.pow(1 - t, 0.85);
    const y = topY + (botY - topY) * t;
    const twist = t * Math.PI * 2.9;  // <- this spiral twist makes it look like a whirlpool
    const pts = [];
    for (let s = 0; s < SEG; s++) {
      const a = (s / SEG) * Math.PI * 2 + twist;
      const wob = 1 + Math.sin(a * 2 + t * 7.5) * 0.08;
      pts.push(new THREE.Vector3(
        Math.cos(a) * rad * wob,
        y + Math.sin(a * 3 + t * 6) * 0.075,
        Math.sin(a) * rad * wob
      ));
    }
    rings.push(pts);
  }

  const cTop = new THREE.Color(0xfff8d0);
  const cBot = new THREE.Color(0xff7d0a);

  for (let r = 0; r < RINGS; r++) {
    const t = r / RINGS;
    const shade = cTop.clone().lerp(cBot, Math.pow(t, 0.75));
    for (let s = 0; s < SEG; s++) {
      const s2 = (s + 1) % SEG;
      const a = rings[r][s];
      const b = rings[r][s2];
      const c = rings[r + 1][s2];
      const d = rings[r + 1][s];
      pushTri(pos, col, a, b, c, shade, 0.14);
      pushTri(pos, col, a, c, d, shade, 0.14);
    }
  }
  return buildGeometry(pos, col);
}

function createFountain() {
  const parts = [];

  // --- stone base tiers ---
  parts.push(colorize(new THREE.CylinderGeometry(1.95, 2.15, 0.52, 9).translate(0, 0.26, 0), 0x9aa0a6, 0.08));
  parts.push(colorize(new THREE.CylinderGeometry(1.7, 1.88, 0.36, 9).translate(0, 0.70, 0), 0xb4babf, 0.08));

  // --- decorative golden rim (low-poly torus) ---
  const rim = new THREE.TorusGeometry(1.58, 0.13, 4, 10);
  rim.rotateX(Math.PI / 2);
  rim.translate(0, 0.90, 0);
  parts.push(colorize(rim, 0xd9a334, 0.09));

  // --- carved stone blocks around the base ---
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const r = 2.12;
    const blk = new THREE.BoxGeometry(0.34, 0.32, 0.34);
    blk.rotateY(-a);
    blk.translate(Math.cos(a) * r, 0.16, Math.sin(a) * r);
    parts.push(colorize(blk, 0x868c92, 0.12));
  }

  // --- four small stone pillars with floating gold caps ---
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const r = 1.62;
    const px = Math.cos(a) * r;
    const pz = Math.sin(a) * r;
    parts.push(colorize(new THREE.CylinderGeometry(0.1, 0.13, 0.85, 6).translate(px, 0.43, pz), 0x8d939a, 0.09));
    parts.push(colorize(new THREE.OctahedronGeometry(0.14, 0).translate(px, 0.98, pz), 0xffcf4d, 0.06));
  }

  const base = new THREE.Mesh(mergeGeos(parts), MAT.body);
  base.castShadow = true;
  base.receiveShadow = true;
  fountainGroup.add(base);

  /* --- THE VORTEX (two layers for depth) --- */
  const vGeo = createVortexGeometry();

  const vortexCore = new THREE.Mesh(vGeo, new THREE.MeshBasicMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.96
  }));
  vortexCore.position.y = 0.9;
  vortexCore.renderOrder = 2;
  fountainGroup.add(vortexCore);

  const vortexShell = new THREE.Mesh(vGeo, new THREE.MeshBasicMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.32,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  vortexShell.position.y = 0.9;
  vortexShell.scale.set(1.28, 1.12, 1.28);
  vortexShell.renderOrder = 3;
  fountainGroup.add(vortexShell);

  /* --- floating golden shards orbiting the vortex --- */
  const shardGeo = new THREE.TetrahedronGeometry(0.11, 0);
  const shardMat = new THREE.MeshBasicMaterial({ color: 0xffd964 });
  const shards = [];
  for (let i = 0; i < 7; i++) {
    const s = new THREE.Mesh(shardGeo, shardMat);
    s.userData = {
      angle: (i / 7) * Math.PI * 2,
      radius: 1.35 + rand() * 0.5,
      speed: 1.4 + rand() * 1.4,
      yOff: rand() * 1.5,
      bob: rand() * 6.28
    };
    fountainGroup.add(s);
    shards.push(s);
  }

  return { vortexCore, vortexShell, shards };
}

const clouds = [];
function createCloud(x, y, z, scale) {
  const g = new THREE.Group();
  const parts = [];
  const blobs = 3 + Math.floor(rand() * 3);
  for (let i = 0; i < blobs; i++) {
    const box = new THREE.BoxGeometry(
      randRange(1.0, 2.0) * scale,
      randRange(0.6, 1.0) * scale,
      randRange(0.9, 1.7) * scale
    );
    box.translate(
      randRange(-1.2, 1.2) * scale,
      randRange(-0.25, 0.35) * scale,
      randRange(-0.9, 0.9) * scale
    );
    parts.push(colorize(box, 0xffffff, 0.04));

  const mesh = new THREE.Mesh(mergeGeos(parts), MAT.body);
  g.add(mesh);
  g.position.set(x, y, z);
  g.userData = { baseY: y, bobPhase: rand() * 6.28, driftSpeed: randRange(0.15, 0.45) };
  scene.add(g);
  clouds.push(g);
  return g;
}

const rocks = [];
function createFloatingRock(x, y, z, scale) {
  const geo = new THREE.IcosahedronGeometry(scale, 0);
  // squash and jitter
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setXYZ(i,
      p.getX(i) * randRange(0.75, 1.25),
      p.getY(i) * randRange(0.55, 0.9),
      p.getZ(i) * randRange(0.75, 1.25)
    );
  }
  const g = colorize(geo, 0x8b7355, 0.15);
  const m = new THREE.Mesh(g, MAT.body);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.userData = { baseY: y, bobPhase: rand() * 6.28, spin: randRange(-0.3, 0.3) };
  scene.add(m);
  rocks.push(m);
  return m;
}

  for (const [lx, lz] of legPositions) {
    parts.push(colorize(new THREE.BoxGeometry(0.17, 0.26, 0.2).translate(lx, 0.13, lz), pal.dark, 0.06));
    // little foot
    parts.push(colorize(new THREE.BoxGeometry(0.19, 0.07, 0.26).translate(lx, 0.035, lz + 0.03), pal.dark, 0.05));
  }

  // ---- TAIL (three tapering segments) ----
  parts.push(colorize(new THREE.BoxGeometry(0.5, 0.32, 0.5).translate(0, 0.36, -0.98), pal.body, 0.06));
  parts.push(colorize(new THREE.BoxGeometry(0.36, 0.24, 0.5).translate(0, 0.33, -1.38), pal.body, 0.06));
  parts.push(colorize(new THREE.BoxGeometry(0.22, 0.16, 0.44).translate(0, 0.31, -1.74), pal.dark, 0.06));

  // ---- BACK SPIKES (small pyramids along the spine and tail) ----
  const spikeZ = [0.45, 0.1, -0.28, -0.65, -1.0, -1.35, -1.66];
  for (let i = 0; i < spikeZ.length; i++) {
    const sz = spikeZ[i];
    const h = 0.2 - Math.abs(sz) * 0.035;
    const sp = new THREE.ConeGeometry(0.08, Math.max(0.09, h), 4);
    sp.translate(0, 0.6 - Math.abs(sz) * 0.02, sz);
    parts.push(colorize(sp, pal.spike, 0.07));
  }

  const merged = mergeGeos(parts);
  merged.scale(S, S, S);
  return merged;
}

/** Pre-build the three croc variants. */
const crocGeo = {
  green:  createCrocGeometry(CROC_PALETTES.green),
  blue:   createCrocGeometry(CROC_PALETTES.blue),
  golden: createCrocGeometry(CROC_PALETTES.golden)
};

/* ------------------------------------------------------------
   5.3 GOLDEN EGG (small floating pickup model)
   ------------------------------------------------------------ */
const eggGeo = (() => {
  const g = new THREE.IcosahedronGeometry(0.22, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    // egg shape: narrower at the top
    const k = 1 + y * 0.35;
    p.setXYZ(i, p.getX(i) * k, y * 1.25, p.getZ(i) * k);
  }
  const merged = colorize(g, 0xffd24a, 0.05);
  merged.computeVertexNormals();
  return merged;
})();

/* ============================================================
   6. PARTICLE SYSTEM (single Points draw call)
   ============================================================ */

const PCOUNT = 420;
const pPositions = new Float32Array(PCOUNT * 3);
const pColors = new Float32Array(PCOUNT * 3);
const pVel = new Float32Array(PCOUNT * 3);
const pLife = new Float32Array(PCOUNT);
let pCursor = 0;

// park all particles far below the world
for (let i = 0; i < PCOUNT; i++) pPositions[i * 3 + 1] = -9999;

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.26,
  vertexColors: true,
  sizeAttenuation: true,
  transparent: true,
  depthWrite: false
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
particleSystem.frustumCulled = false;
scene.add(particleSystem);

/** Spawn a burst of confetti particles. */
function burstParticles(pos, colorHex, count) {
  const c = new THREE.Color(colorHex);
  for (let i = 0; i < count; i++) {
    const idx = pCursor;
    pCursor = (pCursor + 1) % PCOUNT;

    pPositions[idx * 3] = pos.x;
    pPositions[idx * 3 + 1] = pos.y;
    pPositions[idx * 3 + 2] = pos.z;

    const speed = 1.6 + rand() * 3.0;
    const a = rand() * Math.PI * 2;
    const e = rand() * Math.PI * 0.5;

    pVel[idx * 3]     = Math.cos(a) * Math.cos(e) * speed;
    pVel[idx * 3 + 1] = Math.sin(e) * speed + 2.0;
    pVel[idx * 3 + 2] = Math.sin(a) * Math.cos(e) * speed;

    pLife[idx] = 0.85 + rand() * 0.65;

    const f = 0.8 + rand() * 0.4;
    pColors[idx * 3]     = Math.min(1, c.r * f);
    pColors[idx * 3 + 1] = Math.min(1, c.g * f);
    pColors[idx * 3 + 2] = Math.min(1, c.b * f);
  }
  particleGeo.attributes.position.needsUpdate = true;
  particleGeo.attributes.color.needsUpdate = true;
}

/** Advance every particle. */
function updateParticles(dt) {
  let dirty = false;
  for (let i = 0; i < PCOUNT; i++) {
    if (pLife[i] <= 0) continue;
    dirty = true;
    pLife[i] -= dt;
    if (pLife[i] <= 0) {
      pPositions[i * 3 + 1] = -9999;
      continue;
    }
    pVel[i * 3 + 1] -= 11.0 * dt; // gravity
    pPositions[i * 3]     += pVel[i * 3] * dt;
    pPositions[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPositions[i * 3 + 2] += pVel[i * 3 + 2] * dt;
  }
  if (dirty) particleGeo.attributes.position.needsUpdate = true;
}

/* ============================================================
   7. FLOATING TEXT POPUPS (HTML projected from 3D)
   ============================================================ */

const popupLayer = document.getElementById('popups');
const popups = [];          // { el, worldPos, life, maxLife, isEgg }
const _projVec = new THREE.Vector3();

/**
 * Create a floating "+Xg" style popup at a world position.
 * delay = seconds before it appears (used to stagger the egg text).
 */
function spawnPopup(text, worldPos, isEgg = false, delay = 0) {
  const el = document.createElement('div');
  el.className = 'popup' + (isEgg ? ' egg' : '');
  el.textContent = text;
  el.style.opacity = '0';
  popupLayer.appendChild(el);

  popups.push({
    el,
    pos: worldPos.clone(),
    life: 1.75,
    maxLife: 1.75,
    delay,
    isEgg
  });
}

function updatePopups(dt) {
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];

    // stagger delay
    if (p.delay > 0) {
      p.delay -= dt;
      continue;
    }

    p.life -= dt;
    if (p.life <= 0) {
      p.el.remove();
      popups.splice(i, 1);
      continue;
    }

    // drift upwards in world space
    p.pos.y += dt * 1.35;

    // project world → screen
    _projVec.copy(p.pos).project(camera);
    const behind = _projVec.z > 1;
    const x = (_projVec.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-_projVec.y * 0.5 + 0.5) * window.innerHeight;

    const t = 1 - p.life / p.maxLife;           // 0 → 1 over lifetime
    const scale = t < 0.18
      ? 0.4 + (t / 0.18) * 0.85                // pop-in overshoot
      : 1.25 - (t - 0.18) * 0.28;              // settle down

    const alpha = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;

    p.el.style.transform =
      `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${scale.toFixed(3)})`;
    p.el.style.opacity = behind ? '0' : alpha.toFixed(2);
  }
}

/* ============================================================
   8. GAME STATE & ECONOMY
   ============================================================ */

const CONFIG = {
  pollo: { speed: 3.7 },
  croc:  { speed: 3.1, gravity: 22 },
  maxPollos: 80,
  costs: { upgrade2: 30, upgrade3: 220, auto: 110 },
  values: { green: 1, blue: 2, golden: 10 }
};

const state = {
  gold: 0,
  eggs: 0,
  level: 1,
  autoOwned: false,
  autoTimer: 0,
  hudDirty: true
};

/* ------------------------------------------------------------
   WALK PATHS (world coordinates, all on the y = 0 plane)
   ------------------------------------------------------------ */
const PATH_POLLO = [
  new THREE.Vector3(-13.0, 0, 0.6),   // 0 : spawn point in front of the barn
  new THREE.Vector3( -9.4, 0, 0.15),  // 1 : bridge entrance
  new THREE.Vector3( -2.6, 0, 0.0)    // 2 : fountain edge -> gets absorbed
];

const PATH_CROC = [
  new THREE.Vector3( 2.6, 0, 0.0),    // 0 : fountain exit
  new THREE.Vector3( 9.4, 0, 0.0),    // 1 : second bridge
  new THREE.Vector3(15.8, 0, 0.0)     // 2 : cliff edge on the right island
];

const FOUNTAIN_CENTER = new THREE.Vector3(0, 0, 0);

/* ------------------------------------------------------------
   ACTIVE ENTITY LISTS
   ------------------------------------------------------------ */
const pollos = [];        // walking chickens
const crocs = [];         // walking crocodiles
const pendingCrocs = [];  // { variant, timer } — waiting to emerge
const floatingEggs = [];  // golden egg pickups floating up

/* ============================================================
   9. TRANSFORMATION ROLL LOGIC
   ============================================================ */

/**
 * Decide what a red Pollo becomes when it enters the vortex.
 *  L1 : 100% Green
 *  L2 : 50% Blue, 50% Green
 *  L3 : 14% Golden, 56% Blue, 30% Green   (blue path 70% × 20% golden)
 */
function rollTransform() {
  const r = rand();
  if (state.level >= 3) {
    if (r < 0.14) return 'golden';
    if (r < 0.70) return 'blue';
    return 'green';
  }
  if (state.level === 2) {
    return r < 0.5 ? 'blue' : 'green';
  }
  return 'green';
}

/* ============================================================
   10. SPAWNING
   ============================================================ */

/** Spawn one Pollo (chicken) in front of the barn. */
function spawnPollo() {
  if (pollos.length >= CONFIG.maxPollos) return;

  const mesh = new THREE.Mesh(polloGeo.red, MAT.body);
  mesh.castShadow = true;

  const start = PATH_POLLO[0].clone();
  start.x += randRange(-0.55, 0.55);
  start.z += randRange(-0.4, 0.4);
  mesh.position.copy(start);
  mesh.rotation.y = Math.PI / 2; // face +X (towards the fountain)

  scene.add(mesh);

  pollos.push({
    mesh,
    seg: 1,
    speed: CONFIG.pollo.speed * randRange(0.9, 1.12),
    state: 'walk',
    phase: rand() * Math.PI * 2,
    t: 0,
    result: null,
    swapped: false
  });
}

/** Spawn the crocodile that emerges from the vortex. */
function spawnCroc(variant) {
  const geo = crocGeo[variant] || crocGeo.green;
  const mat = variant === 'golden' ? MAT.gold : MAT.body;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.position.set(PATH_CROC[0].x, 0, PATH_CROC[0].z);
  mesh.rotation.y = Math.PI / 2;
  mesh.scale.setScalar(0.01);
  scene.add(mesh);

  crocs.push({
    mesh,
    seg: 1,
    speed: CONFIG.croc.speed * randRange(0.92, 1.1),
    state: 'emerge',
    t: 0,
    variant,
    phase: rand() * Math.PI * 2,
    fallV: 0,
    awarded: false
  });
}

/* ============================================================
   11. UPDATES — ENTITIES
   ============================================================ */

/** Generic "walk along a path" helper. Returns true when the path ends. */
function walkAlong(entity, path, dt) {
  const target = path[entity.seg];
  if (!target) return true;

  const m = entity.mesh;
  const dx = target.x - m.position.x;
  const dz = target.z - m.position.z;
  const dist = Math.hypot(dx, dz);
  const step = entity.speed * dt;

  if (dist <= step || dist < 0.0001) {
    m.position.x = target.x;
    m.position.z = target.z;
    entity.seg++;
    return entity.seg >= path.length;
  }

  m.position.x += (dx / dist) * step;
  m.position.z += (dz / dist) * step;
  m.rotation.y = Math.atan2(dx, dz); // model faces +Z
  return false;
}

function updatePollos(dt) {
  for (let i = pollos.length - 1; i >= 0; i--) {
    const p = pollos[i];
    const m = p.mesh;

    /* ---------- WALKING ---------- */
    if (p.state === 'walk') {
      const done = walkAlong(p, PATH_POLLO, dt);

      // cute waddle: bob up/down + slight roll
      p.phase += dt * 13;
      m.position.y = Math.abs(Math.sin(p.phase)) * 0.055;
      m.rotation.z = Math.sin(p.phase) * 0.06;

      if (done) {
        p.state = 'swirl';
        p.t = 0;
        p.result = rollTransform();
        p.swapped = false;
      }
    }

    /* ---------- BEING SWIRLED INTO THE VORTEX ---------- */
    else if (p.state === 'swirl') {
      p.t += dt;
      const k = Math.min(1, p.t / 0.95);   // 0..1 progress

      // spiral inward & upward
      const ang = Math.PI + k * Math.PI * 4.5;
      const rad = 2.05 * (1 - k) + 0.16;
      m.position.set(
        FOUNTAIN_CENTER.x + Math.cos(ang) * rad,
        0.35 + k * 1.15,
        FOUNTAIN_CENTER.z + Math.sin(ang) * rad
      );
      m.rotation.y += dt * 17;
      m.rotation.z = Math.sin(p.t * 14) * 0.35;

      // shrink into nothing
      const sc = 1 - k * k * 0.92;
      m.scale.setScalar(sc);

      // mid-swirl colour upgrade (blue / golden)
      if (!p.swapped && k > 0.32 && p.result !== 'green') {
        p.swapped = true;
        if (p.result === 'golden') {
          m.geometry = polloGeo.golden;
          m.material = MAT.gold;
          burstParticles(m.position, 0xffd75e, 12);
        } else {
          m.geometry = polloGeo.blue;
          burstParticles(m.position, 0x6fb8ff, 10);
        }
      }

      // fully absorbed -> queue the crocodile
      if (k >= 1) {
        scene.remove(m);
        pollos.splice(i, 1);

        burstParticles(new THREE.Vector3(0, 1.9, 0), 0xffe08a, 20);
        pendingCrocs.push({ variant: p.result, timer: 0.45 });
      }
    }
  }
}

function updateCrocs(dt) {
  for (let i = crocs.length - 1; i >= 0; i--) {
    const c = crocs[i];
    const m = c.mesh;

    /* ---------- EMERGING FROM THE VORTEX ---------- */
    if (c.state === 'emerge') {
      c.t += dt;
      const k = Math.min(1, c.t / 0.38);
      const e = 1 - Math.pow(1 - k, 3);   // ease-out cubic
      m.scale.setScalar(Math.max(0.01, e));
      m.rotation.z = Math.sin(k * Math.PI) * 0.25;

      if (k >= 1) {
        m.scale.setScalar(1);
        m.rotation.z = 0;
        c.state = 'walk';
      }
    }

    /* ---------- WALKING ACROSS THE ISLANDS ---------- */
    else if (c.state === 'walk') {
      const done = walkAlong(c, PATH_CROC, dt);

      // heavy waddle
      c.phase += dt * 9;
      m.position.y = Math.abs(Math.sin(c.phase)) * 0.045;
      m.rotation.z = Math.sin(c.phase) * 0.04;

      if (done) {
        c.state = 'fall';
        c.fallV = 0.5;

        // ---- PAY OUT when the croc reaches the cliff ----
        if (!c.awarded) {
          c.awarded = true;
          awardCroc(c);
        }
      }
    }

    /* ---------- FALLING OFF THE CLIFF ---------- */
    else if (c.state === 'fall') {
      c.fallV += CONFIG.croc.gravity * dt;
      m.position.x += c.speed * 0.85 * dt;
      m.position.y -= c.fallV * dt;
      m.rotation.z -= dt * 3.2;
      m.rotation.x += dt * 0.9;

      if (m.position.y < -16) {
        scene.remove(m);
        crocs.splice(i, 1);
      }
    }
  }
}

/** Award gold (and possibly a golden egg) for a finished crocodile. */
function awardCroc(c) {
  const variant = c.variant;
  const value = CONFIG.values[variant] || 1;

  state.gold += value;
  state.hudDirty = true;

  const popPos = c.mesh.position.clone();
  popPos.y += 1.0;

  spawnPopup('+' + value + 'g', popPos, false, 0);

  if (variant === 'golden') {
    state.eggs += 1;
    spawnPopup('+1 🥚', popPos.clone().add(new THREE.Vector3(0, 0.55, 0)), true, 0.25);
    burstParticles(popPos, 0xffe08a, 26);

    // spawn a floating golden egg model that drifts up
    const eggMesh = new THREE.Mesh(eggGeo, MAT.gold);
    eggMesh.position.copy(popPos);
    eggMesh.castShadow = true;
    scene.add(eggMesh);
    floatingEggs.push({ mesh: eggMesh, life: 1.9, vy: 1.9 });
  } else {
    burstParticles(popPos, variant === 'blue' ? 0x6fb8ff : 0x8ee04c, 12);
  }

  // pulse the HUD counters
  pulseStat('goldStat');
  if (variant === 'golden') pulseStat('eggStat');
}

function updateFloatingEggs(dt) {
  for (let i = floatingEggs.length - 1; i >= 0; i--) {
    const e = floatingEggs[i];
    e.life -= dt;
    e.mesh.position.y += e.vy * dt;
    e.mesh.rotation.y += dt * 4.0;
    e.mesh.rotation.x += dt * 1.6;
    const s = Math.max(0.01, Math.min(1, e.life / 1.9));
    e.mesh.scale.setScalar(s);
    if (e.life <= 0) {
      scene.remove(e.mesh);
      floatingEggs.splice(i, 1);
    }
  }
}

/** Wait for the transformation delay then spawn the crocodile. */
function updatePendingCrocs(dt) {
  for (let i = pendingCrocs.length - 1; i >= 0; i--) {
    const pc = pendingCrocs[i];
    pc.timer -= dt;
    if (pc.timer <= 0) {
      spawnCroc(pc.variant);
      burstParticles(new THREE.Vector3(2.2, 1.0, 0), 0xffd75e, 10);
      pendingCrocs.splice(i, 1);
    }
  }
}

/* ============================================================
   12. WORLD ANIMATION (vortex, rings, clouds, rocks)
   ============================================================ */

function updateWorld(dt, time) {
  // --- vortex spin & pulse ---
  fountain.vortexCore.rotation.y += dt * 1.35;
  fountain.vortexShell.rotation.y -= dt * 2.1;

  const pulse = 1 + Math.sin(time * 2.6) * 0.045;
  fountain.vortexCore.scale.set(pulse, 1 + Math.sin(time * 3.3) * 0.06, pulse);
  fountain.vortexShell.scale.set(
    1.28 * pulse,
    (1.12 + Math.sin(time * 3.3 + 1.0) * 0.07),
    1.28 * pulse
  );

  // --- orbiting golden shards ---
  for (const s of fountain.shards) {
    const d = s.userData;
    d.angle += dt * d.speed * 0.6;
    const y = 0.75 + Math.sin(time * 1.8 + d.bob) * 0.85 + d.yOff * 0.2;
    s.position.set(
      Math.cos(d.angle) * d.radius,
      y,
      Math.sin(d.angle) * d.radius
    );
    s.rotation.x += dt * 2.2;
    s.rotation.y += dt * 1.7;
  }

  // --- vortex light flicker ---
  vortexLight.intensity = 2.0 + Math.sin(time * 5.0) * 0.45 + Math.sin(time * 11.0) * 0.18;

  // --- pulsing ground rings ---
  for (const r of pulseRings) {
    let t = (time * 0.5 + r.userData.phase) % 1;
    const s = 1 + t * 2.6;
    r.scale.set(s, 1, s);
    r.material.opacity = (1 - t) * 0.72;
  }

  // --- clouds drift & bob ---
  for (const c of clouds) {
    c.position.x += c.userData.driftSpeed * dt;
    if (c.position.x > 46) c.position.x = -46;
    c.position.y = c.userData.baseY + Math.sin(time * 0.6 + c.userData.bobPhase) * 0.9;
  }

  // --- floating rocks bob & spin ---
  for (const r of rocks) {
    r.position.y = r.userData.baseY + Math.sin(time * 0.8 + r.userData.bobPhase) * 0.7;
    r.rotation.y += r.userData.spin * dt;
    r.rotation.x += r.userData.spin * 0.4 * dt;
  }
}

/** Cost of the next fountain upgrade (or null if maxed). */
function nextUpgradeCost() {
  if (state.level === 1) return CONFIG.costs.upgrade2;
  if (state.level === 2) return CONFIG.costs.upgrade3;
  return null;
}

/** Human-readable odds line for the top-right panel. */
function oddsString() {
  if (state.level === 1) {
    return 'Red Pollo → 🟢 Green Croc <b>100%</b>';
  }
  if (state.level === 2) {
    return '🔵 Blue Croc <b>50%</b> · 🟢 Green Croc <b>50%</b>';
  }
  return '✨ Golden Croc <b>14%</b> · 🔵 Blue <b>56%</b> · 🟢 Green <b>30%</b>';
}

function updateHUD() {
  elGold.textContent = Math.floor(state.gold);
  elEgg.textContent = state.eggs;
  elLevelNum.textContent = state.level;
  elLevelBar.style.width = ((state.level / 3) * 100) + '%';
  elOdds.innerHTML = oddsString();

  const cost = nextUpgradeCost();
  if (cost === null) {
    btnUpgrade.disabled = true;
    elUpgradeCost.textContent = 'MAX LEVEL ✨';
  } else {
    btnUpgrade.disabled = state.gold < cost;
    elUpgradeCost.textContent = cost + ' 🪙';
  }

  if (state.autoOwned) {
    btnAuto.disabled = true;
    elAutoCost.textContent = 'AKTYWNY ✔';
  } else {
    btnAuto.disabled = state.gold < CONFIG.costs.auto;
    elAutoCost.textContent = CONFIG.costs.auto + ' 🪙';
  }
}

  pointer.x = e.clientX;
  pointer.y = e.clientY;
  try { canvasEl.setPointerCapture(e.pointerId); } catch (_) {}
});

canvasEl.addEventListener('pointerup', (e) => {
  pointer.down = false;
  try { canvasEl.releasePointerCapture(e.pointerId); } catch (_) {}
});

canvasEl.addEventListener('pointercancel', () => { pointer.down = false; });

canvasEl.addEventListener('pointermove', (e) => {
  if (!pointer.down) return;
  const dx = e.clientX - pointer.x;
  const dy = e.clientY - pointer.y;
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 2) pointer.moved = true;

  camState.theta -= dx * 0.0062;
  camState.phi = clamp(camState.phi - dy * 0.0052, 0.24, 1.44);
});

canvasEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  camState.radius = clamp(camState.radius + e.deltaY * 0.022, 13, 62);
}, { passive: false });

/* Simple camera shake for upgrade feedback */
let shakeAmount = 0;
const _baseTarget = new THREE.Vector3();

/* ============================================================
   15. WINDOW RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   16. MAIN GAME LOOP
   ============================================================ */

let _lastTime = performance.now();
let _elapsed = 0;
let _hudAccum = 0;

function animate(now) {
  requestAnimationFrame(animate);

  // delta time, clamped so tab-switching doesn't break physics
  let dt = (now - _lastTime) / 1000;
  _lastTime = now;
  dt = Math.min(dt, 0.05);
  _elapsed += dt;

  /* ---- auto spawner ---- */
  if (state.autoOwned) {
    state.autoTimer -= dt;
    while (state.autoTimer <= 0) {
      spawnPollo();
      state.autoTimer += 1.0;
    }
  }

  /* ---- entities ---- */
  updatePollos(dt);
  updateCrocs(dt);
  updatePendingCrocs(dt);
  updateFloatingEggs(dt);

  /* ---- world FX ---- */
  updateWorld(dt, _elapsed);
  updateParticles(dt);
  updatePopups(dt);

  /* ---- camera (with shake) ---- */
  if (shakeAmount > 0) {
    shakeAmount = Math.max(0, shakeAmount - dt * 2.2);
    const s = shakeAmount * 0.35;
    camState.target.set(
      (Math.random() - 0.5) * s,
      1.6 + (Math.random() - 0.5) * s,
      (Math.random() - 0.5) * s
    );
  } else {
    camState.target.lerp(_baseTarget, Math.min(1, dt * 6));
  }
  updateCamera();

  /* ---- HUD (only when dirty, ~4x per second check) ---- */
  _hudAccum += dt;
  if (state.hudDirty || _hudAccum > 0.25) {
    _hudAccum = 0;
    updateHUD();
    state.hudDirty = false;
  }

  renderer.render(scene, camera);
}

/* ============================================================
   17. BOOT
   ============================================================ */

// initial HUD state
updateHUD();

// give the player a tiny head start so the first upgrade feels reachable
state.gold = 0;

// spawn a couple of chickens immediately so the world feels alive
spawnPollo();
setTimeout(() => spawnPollo(), 260);

// go!
requestAnimationFrame(animate);

/* ============================================================
   NOTES ON THE UNUSED-FIX HELPER
   ------------------------------------------------------------
   createIslandGeometry() writes a placeholder colour for the
   bottom tip triangles; createIslandGeometryFixed() re-paints
   the low vertices with the correct dark-rock tone. This keeps
   the code readable while guaranteeing a clean palette.
   ============================================================ */
</script>
